<!DOCTYPE html>
<html>
<head>
  <title>Admin Login | Neelam’s Kitchen</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-amber-500 to-pink-500">

<div class="bg-white p-10 rounded-3xl shadow-xl w-full max-w-md">
  <h2 class="text-3xl font-extrabold text-center mb-6">Admin Login</h2>

  <form id="loginForm" class="space-y-5">
    <input id="username" placeholder="Username" class="w-full border rounded-xl px-4 py-3" required>
    <input id="password" type="password" placeholder="Password" class="w-full border rounded-xl px-4 py-3" required>

    <button class="w-full bg-amber-600 text-white py-3 rounded-xl font-semibold hover:bg-amber-700">
      Login
    </button>
  </form>
</div>

<script>
  document.getElementById("loginForm").addEventListener("submit", e => {
    e.preventDefault();

    const u = username.value;
    const p = password.value;

    if (u === "admin" && p === "1234") {
      localStorage.setItem("adminAuth", "true");
      window.location.href = "admin.html";
    } else {
      alert("Invalid credentials");
    }
  });
</script>

</body>
</html>
